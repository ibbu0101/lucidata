<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgVL" cx="30%" cy="45%" r="85%">
      <stop offset="0%" stop-color="#060B08"/>
      <stop offset="100%" stop-color="#010302"/>
    </radialGradient>
    <radialGradient id="haloVL" cx="14%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#33F2A0" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#33F2A0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scanL" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="transparent"/>
      <line x1="0" y1="0" x2="8" y2="0" stroke="#33F2A0" stroke-width="1" opacity="0.045"/>
    </pattern>
    <filter id="glowL" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glyphFillL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6BFFC4"/>
      <stop offset="100%" stop-color="#33F2A0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" fill="url(#bgVL)"/>
  <rect width="900" height="260" fill="url(#scanL)"/>
  <circle cx="130" cy="130" r="190" fill="url(#haloVL)"/>

  <g transform="translate(48,30) scale(0.44)" filter="url(#glowL)"
     stroke="url(#glyphFillL)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 92,132 L 160,196 L 92,260" fill="none" stroke-width="17"/>
    <path d="M 208,124 L 208,262 L 302,262" fill="none" stroke-width="17"/>
  </g>
  <rect x="182" y="150" width="14" height="20" rx="2" fill="#F2B84B" filter="url(#glowL)"/>

  <text x="270" y="128" font-family="'Courier New', Courier, monospace" font-weight="700"
        font-size="52" fill="url(#glyphFillL)" filter="url(#glowL)" letter-spacing="1">lucidata</text>
  <line x1="272" y1="145" x2="560" y2="145" stroke="#1B8F5E" stroke-width="1.5" opacity="0.6"/>
  <text x="272" y="172" font-family="'Courier New', Courier, monospace" font-size="14.5"
        fill="#1B8F5E" letter-spacing="1">$ pip install lucidata</text>
  <text x="272" y="196" font-family="'Courier New', Courier, monospace" font-size="14.5"
        fill="#3E5548" letter-spacing="0.5">profile · clean · explain — 100% local</text>
</svg>