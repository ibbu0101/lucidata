<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgV" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#060B08"/>
      <stop offset="100%" stop-color="#010302"/>
    </radialGradient>
    <radialGradient id="haloV" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#33F2A0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#33F2A0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="transparent"/>
      <line x1="0" y1="0" x2="8" y2="0" stroke="#33F2A0" stroke-width="1" opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glyphFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6BFFC4"/>
      <stop offset="100%" stop-color="#33F2A0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="58" fill="url(#bgV)"/>
  <rect width="400" height="400" rx="58" fill="url(#scan)"/>
  <circle cx="200" cy="192" r="168" fill="url(#haloV)"/>

  <!-- hairline frame, quiet, gives an edge to sit against -->
  <rect x="18" y="18" width="364" height="364" rx="46" fill="none"
        stroke="#1B8F5E" stroke-width="1.5" opacity="0.35"/>

  <!-- glyph: caret + L, refined proportions, symmetric margins -->
  <g filter="url(#glow)" stroke="url(#glyphFill)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 92,132 L 160,196 L 92,260" fill="none" stroke-width="17"/>
    <path d="M 208,124 L 208,262 L 302,262" fill="none" stroke-width="17"/>
  </g>

  <!-- cursor: brand amber, ties to the rest of the family -->
  <rect x="318" y="236" width="32" height="46" rx="3" fill="#F2B84B" filter="url(#glow)"/>
</svg>