[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lucidata"
version = "0.1.0"
description = "LUCIDATA: Local-first AI-powered EDA reports with privacy-preserving narrative summaries"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "LUCIDATA Contributors", email = "opensource@lucidata.dev"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "polars>=1.10",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "pydantic>=2.8",
  "pandera>=0.19",
  "instructor>=1.5",
  "litellm>=1.48",
  "pyarrow>=16.1",
  "jinja2>=3.1",
  "weasyprint>=60.0",
  "plotly>=5.22",
  "seaborn>=0.13",
  "matplotlib>=3.8",
  "typer>=0.12",
  "rich>=13.7",
  "streamlit>=1.36",
]
optional-dependencies = {dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "pre-commit>=3.7",
  "mypy>=1.10",
]}

[project.scripts]
lucidata = "lucidata.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lucidata"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PL"]
ignore = []
fixable = ["ALL"]
unfixable = []
exclude = [".venv", "venv", ".git", "__pycache__", "dist", "build", "*.egg-info"]

[tool.ruff.lint]
per-file-ignores = {}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]